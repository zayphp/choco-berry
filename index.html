<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b170f">
  <meta name="description" content="Choco Berry — har bir shirinlikda baxt bor! Buyurtma va bog‘lanish uchun bizga yozing.">
  <title>Choco Berry | Sweets & Desserts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fff5e9;
      --cream2: #f8e6d4;
      --brown: #3b170f;
      --brown2: #5a281b;
      --berry: #b92f45;
      --muted: #86685c;
      --white: #fffdf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--brown);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 12% 15%, rgba(185,47,69,.10), transparent 24%),
        radial-gradient(circle at 90% 82%, rgba(112,54,30,.12), transparent 27%),
        linear-gradient(145deg, #fff8ef, #f6e2d0);
      display: grid; place-items: center; padding: 28px 16px;
    }
    .page { width: min(100%, 440px); }
    .card {
      position: relative; overflow: hidden; text-align: center;
      padding: 25px 23px 27px; border: 1px solid rgba(91,42,27,.14);
      border-radius: 30px; background: rgba(255,253,249,.88);
      box-shadow: 0 22px 65px rgba(73,35,20,.16);
      backdrop-filter: blur(8px);
    }
    .card::before, .card::after {
      content: "✦"; position: absolute; color: rgba(185,47,69,.25);
      font-size: 25px; pointer-events: none;
    }
    .card::before { top: 18px; left: 20px; }
    .card::after { right: 22px; bottom: 20px; }
    .logo-wrap {
      width: min(100%, 310px); aspect-ratio: 1; margin: 0 auto 17px;
      border-radius: 50%; overflow: hidden; border: 5px solid #f1d6bd;
      box-shadow: 0 9px 25px rgba(59,23,15,.16);
      background: var(--cream2);
    }
    .logo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .eyebrow {
      margin: 0 0 5px; color: var(--berry); font-size: 11px;
      letter-spacing: .28em; font-weight: 700; text-transform: uppercase;
    }
    h1 {
      margin: 0; font: 800 clamp(36px, 10vw, 48px)/1.08 "Playfair Display", serif;
      letter-spacing: -.04em; color: var(--brown);
    }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
    .slogan { margin: 17px 0 22px; font: italic 19px/1.4 "Playfair Display", serif; color: var(--brown2); }
    .slogan span { color: var(--berry); }
    .links { display: grid; gap: 11px; }
    .link {
      display: flex; align-items: center; justify-content: center; gap: 11px;
      min-height: 55px; padding: 13px 18px; border-radius: 16px;
      text-decoration: none; font-weight: 700; font-size: 15px;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
      box-shadow: 0 6px 15px rgba(59,23,15,.10);
    }
    .link:hover { transform: translateY(-3px); box-shadow: 0 11px 22px rgba(59,23,15,.16); filter: brightness(1.04); }
    .link:active { transform: scale(.985); }
    .link svg { width: 21px; height: 21px; flex: 0 0 auto; }
    .instagram { background: linear-gradient(110deg, #8f315e, #d34d65, #ef9b58); color: white; }
    .telegram { background: #229ed9; color: white; }
    .phone { background: var(--brown); color: white; }
    .footer { margin: 22px 0 0; color: #a48a7d; font-size: 11px; letter-spacing: .08em; }
    @media (max-width: 380px) {
      .card { padding: 20px 16px 23px; border-radius: 24px; }
      .logo-wrap { width: min(100%, 270px); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Choco Berry aloqa sahifasi">
      <div class="logo-wrap">
        <img src="assets/choco-berry-logo.jpg" alt="Choco Berry — Sweets & Desserts logotipi">
      </div>
      <p class="eyebrow">Sweets & Desserts</p>
      <h1>Choco Berry</h1>
      <p class="subtitle">Bulung‘ur</p>
      <p class="slogan">Har bir shirinlikda <span>baxt bor!</span> ♡</p>

      <nav class="links" aria-label="Bog‘lanish havolalari">
        <a class="link instagram" href="https://www.instagram.com/bulungur_chocoberry/" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.8" r="1.2" fill="currentColor"/></svg>
          Instagram
        </a>
        <a class="link telegram" href="https://t.me/+nq0uBWfi_3VjOTVi" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 4.4 18.5 20c-.24 1.1-.88 1.36-1.78.85l-4.92-3.63-2.37 2.28c-.26.26-.48.48-.98.48l.35-5 9.1-8.23c.4-.35-.09-.55-.62-.2L6.03 13.7l-4.82-1.5c-1.05-.33-1.07-1.05.22-1.56L20.3 3.2c.88-.32 1.65.22 1.4 1.2Z"/></svg>
          Telegram
        </a>
        <a class="link phone" href="tel:+998991870234">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.35 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.1 9.9a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.35 1.84.58 2.8.7A2 2 0 0 1 22 16.9Z"/></svg>
          +998 99 187 02 34
        </a>
      </nav>
      <p class="footer">MAZALI LAHZALAR SHU YERDAN BOSHLANADI</p>
    </section>
  </main>
</body>
</html>
